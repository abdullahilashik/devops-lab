name: Github CI-CD practice
run-name: Deployment for ${{ github.ref_name }} by ${{ github.actor }}

on:
  push:
    branches: [master]   
    paths:
      - "app/nestjs-devops/*/**" # only trigger if files in this folder change
      - ".github/workflows/ci-cd.yaml" # trigger if ci cd workflow updated since we are practicing
      - "app/nestjs-devops/Dockerfile"
  pull_request:
    branches: [master]

jobs:
  build-and-test:    
    runs-on: ubuntu-latest    
    defaults:
      run:
        working-directory: app/nestjs-microservice

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4 # FIXED: Use the real latest version (v4)

      - name: Debug File Structure
        run: ls -R # This will now show your files!

      - name: Setup nodejs
        uses: actions/setup-node@v4 # FIXED: Use the real latest version (v4)        
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/nestjs-microservice/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: app/nestjs-microservice

      - name: Run test
        run: npm run test
        working-directory: app/nestjs-microservice

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    defaults:
      run:
        working-directory: app/nestjs-microservice

    steps:
      - name: Checkoiut
        uses: actions/checkout@v7

      - name: Deploy to production
        run: |
          echo "Deploying to server...."

  build-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pacakges: write
    defaults:
      run:
        working-directory: app/nestjs-microservice

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to github container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push docker image
        uses: docker/build-push-action@v5
        with:
          context: app/nestjs-microservice
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}