name: Github CI-CD practice
run-name: Deployment for ${{ github.ref_name }} by ${{ github.actor }}

on:
  push:
    branches: [master]    
  pull_request:
    branches: [master]

jobs:

  build-and-test:    
    runs-on: ubuntu-latest    
    defaults:
      run:
        working-directory: app/nestjs-microservice

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup nodejs
        uses: actions/setup-node@v7        
        with:
          node-version: 22
          # cache: 'npm'
          # cache-dependency-path: app/nestjs-microservice/package-lock.json

      # ADD THIS STEP RIGHT HERE
      - name: Print Directory Structure
        run: ls -R 