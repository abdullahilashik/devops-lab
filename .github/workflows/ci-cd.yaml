name: Nestjs CI CD Testing
run-name: Deployment for ${github.ref_name} by ${github.actor}

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # give the job a name
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app/nestjs-microservice

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dependency installation
        run: npm ci

      - name: Run Tests
        run: npm test