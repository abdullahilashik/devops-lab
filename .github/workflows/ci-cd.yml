name: Github CI-CD practice
run-name: Deployment for ${{ github.ref_name }} by ${{ github.actor }}

on:
  push:
    branches: [master]    
  pull_request:
    branches: [master]

jobs:

  build-and-test:
    runs-on: ubuntu-latest
    if: github.ref_name == '/refs/heads/master'
    defaults:
      run:
        working-directory: app/nestjs-devops

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup nodejs
        uses: actions/setup-node@v7        
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/nestjs-devops/package-lock.json

      - name: Install dependencies
        run: npm ci        

      - name: Run test
        run: npm run test

  build-image:
    needs: build-and-test
    runs-on: ubuntu-latest    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout for build image
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v5
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the docker image and push
        uses: docker/build-push-action@v3
        with:
          context: app/nestjs-devops
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sh }}