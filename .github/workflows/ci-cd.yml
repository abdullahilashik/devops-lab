name: Github CI-CD practice
run-name: Deployment for ${{ github.ref_name }} by ${{ github.actor }}

on:
  push:
    branches: [master]
    paths:
      - "./app/nestjs-devops"
      - "./.github/workflows/ci-cd-yml"
  pull_request:
    branches: [master]

jobs:

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup nodejs
        uses: action/setup-node@v4
        with:
          node: 24

      - name: Install dependencies
        run: npm ci

      - name: Run test
        run: npm run test