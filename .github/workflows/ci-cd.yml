name: Github CI-CD practice
run-name: Deployment for ${{ github.ref_name }} by ${{ github.actor }}

on:
  push:
    branches: [master]    
  pull_request:
    branches: [master]

jobs:

  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/nestjs-devops

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup nodejs
        uses: actions/setup-node@v7

      - name: Install dependencies
        run: npm ci        

      - name: Run test
        run: npm run test