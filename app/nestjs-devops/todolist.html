<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✨ Todo List</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');

        * {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0b0d15;
            --bg-secondary: #141824;
            --bg-card: rgba(255, 255, 255, 0.04);
            --border-glow: rgba(99, 102, 241, 0.25);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #818cf8;
            --accent-glow: rgba(129, 140, 248, 0.35);
            --accent-hover: #6366f1;
            --complete: #34d399;
            --delete: #f87171;
            --delete-hover: #ef4444;
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            --radius: 20px;
        }

        [data-theme="light"] {
            --bg-primary: #f1f5f9;
            --bg-secondary: #e2e8f0;
            --bg-card: rgba(255, 255, 255, 0.7);
            --border-glow: rgba(99, 102, 241, 0.15);
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* ── Glow orbs ── */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
            transition: 0.6s ease;
        }
        .orb-1 {
            width: 500px;
            height: 500px;
            background: rgba(129, 140, 248, 0.25);
            top: -150px;
            right: -100px;
        }
        .orb-2 {
            width: 400px;
            height: 400px;
            background: rgba(52, 211, 153, 0.15);
            bottom: -100px;
            left: -100px;
        }
        [data-theme="light"] .orb-1 {
            opacity: 0.2;
        }
        [data-theme="light"] .orb-2 {
            opacity: 0.15;
        }

        /* ── Card ── */
        .app-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 640px;
            background: var(--bg-card);
            backdrop-filter: blur(28px) saturate(1.4);
            -webkit-backdrop-filter: blur(28px) saturate(1.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            border-radius: var(--radius);
            padding: 32px 28px;
            transition: background 0.4s ease, border 0.4s ease, box-shadow 0.4s ease;
        }

        /* ── Header ── */
        .header-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #a5b4fc, #818cf8, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-sub {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        /* ── Theme toggle ── */
        .theme-toggle {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s ease;
            font-size: 22px;
            backdrop-filter: blur(8px);
        }
        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.12);
            transform: rotate(12deg) scale(1.04);
        }

        /* ── Input ── */
        .todo-input-wrap {
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 4px 4px 4px 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: 0.3s ease;
            backdrop-filter: blur(8px);
        }
        .todo-input-wrap:focus-within {
            border-color: var(--border-glow);
            box-shadow: 0 0 0 4px var(--accent-glow);
            background: rgba(255, 255, 255, 0.06);
        }
        .todo-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 15px;
            padding: 14px 0;
            font-weight: 450;
            letter-spacing: 0.2px;
        }
        .todo-input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }
        .todo-input:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-add {
            padding: 12px 24px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #818cf8, #6366f1);
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s ease;
            white-space: nowrap;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
        }
        .btn-add:hover:not(:disabled) {
            transform: scale(1.03) translateY(-1px);
            box-shadow: 0 6px 24px rgba(99, 102, 241, 0.45);
        }
        .btn-add:active:not(:disabled) {
            transform: scale(0.97);
        }
        .btn-add:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* ── Filters ── */
        .filter-btn {
            padding: 8px 18px;
            border-radius: 40px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.25s ease;
            letter-spacing: 0.2px;
        }
        .filter-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }
        .filter-btn.active {
            background: rgba(129, 140, 248, 0.15);
            color: #a5b4fc;
            border-color: rgba(129, 140, 248, 0.2);
            box-shadow: 0 0 20px rgba(129, 140, 248, 0.05);
        }
        .filter-btn.active:hover {
            background: rgba(129, 140, 248, 0.2);
        }
        [data-theme="light"] .filter-btn.active {
            background: rgba(99, 102, 241, 0.1);
            color: #4f46e5;
            border-color: rgba(99, 102, 241, 0.15);
        }

        /* ── Stats ── */
        .stats-text {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 450;
            letter-spacing: 0.2px;
        }
        .stats-text span {
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* ── Todo list ── */
        .todo-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 420px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .todo-list::-webkit-scrollbar {
            width: 4px;
        }
        .todo-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .todo-list::-webkit-scrollbar-thumb {
            background: rgba(129, 140, 248, 0.3);
            border-radius: 10px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px 12px 18px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: 0.3s ease;
            animation: slideUp 0.35s ease forwards;
            backdrop-filter: blur(4px);
        }
        .todo-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.07);
        }
        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }
        .todo-item.completed .todo-check {
            background: var(--complete);
            border-color: var(--complete);
            color: #0b0d15;
        }
        .todo-item.completed .todo-check svg {
            opacity: 1;
        }
        .todo-item.completed {
            opacity: 0.7;
        }

        .todo-check {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--text-muted);
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.25s ease;
            color: transparent;
        }
        .todo-check svg {
            width: 14px;
            height: 14px;
            opacity: 0;
            transition: 0.2s ease;
        }
        .todo-check:hover {
            border-color: var(--accent);
            background: rgba(129, 140, 248, 0.08);
        }
        .todo-item.completed .todo-check:hover {
            background: var(--complete);
            border-color: var(--complete);
        }

        .todo-text {
            flex: 1;
            font-size: 15px;
            font-weight: 450;
            color: var(--text-primary);
            word-break: break-word;
            transition: 0.25s ease;
            line-height: 1.4;
        }

        .todo-delete {
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.25s ease;
            font-size: 18px;
        }
        .todo-delete:hover {
            background: rgba(248, 113, 113, 0.12);
            color: var(--delete);
            transform: scale(1.05);
        }
        .todo-delete:active {
            transform: scale(0.92);
        }

        /* ── Empty state ── */
        .empty-state {
            text-align: center;
            padding: 48px 20px 36px;
            color: var(--text-muted);
        }
        .empty-state .empty-icon {
            font-size: 52px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        .empty-state h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .empty-state p {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* ── Animations ── */
        @keyframes slideUp {
            0% {
                opacity: 0;
                transform: translateY(14px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .todo-item.removing {
            animation: slideDown 0.3s ease forwards;
        }
        @keyframes slideDown {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-10px) scale(0.95);
            }
        }

        /* ── Responsive ── */
        @media (max-width: 500px) {
            .app-card {
                padding: 20px 16px;
                border-radius: 16px;
            }
            .header-title {
                font-size: 22px;
            }
            .todo-input-wrap {
                flex-direction: column;
                padding: 4px;
                gap: 8px;
                border-radius: 14px;
            }
            .todo-input {
                padding: 12px 16px;
                font-size: 15px;
            }
            .btn-add {
                width: 100%;
                padding: 14px;
                justify-content: center;
                border-radius: 12px;
            }
            .todo-item {
                padding: 10px 12px 10px 14px;
                gap: 10px;
            }
            .todo-text {
                font-size: 14px;
            }
            .filter-btn {
                padding: 6px 14px;
                font-size: 12px;
            }
            .orb-1 {
                width: 300px;
                height: 300px;
                top: -80px;
                right: -60px;
            }
            .orb-2 {
                width: 250px;
                height: 250px;
                bottom: -60px;
                left: -60px;
            }
        }

        /* ── Scrollbar global ── */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(129, 140, 248, 0.25);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- Glow orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- ─── APP ─── -->
    <div class="app-card">

        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <div class="header-title">✦ todo</div>
                <div class="header-sub mt-0.5">organize your day</div>
            </div>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <span id="themeIcon">🌙</span>
            </button>
        </div>

        <!-- Input -->
        <div class="todo-input-wrap mb-5">
            <input
            type="text"
            class="todo-input"
            id="todoInput"
            placeholder="Write a new task…"
            maxlength="120"
            autofocus
            />
            <button class="btn-add" id="addBtn">➕ Add</button>
        </div>

        <!-- Filters + Stats -->
        <div class="flex items-center justify-between flex-wrap gap-3 mb-5">
            <div class="flex gap-1.5">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Done</button>
            </div>
            <div class="stats-text" id="stats">
                <span id="countDisplay">0</span> tasks
            </div>
        </div>

        <!-- Todo List -->
        <div id="todoListContainer">
            <ul class="todo-list" id="todoList">
                <!-- rendered by JS -->
            </ul>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ─── DOM refs ───
            const todoList = document.getElementById('todoList');
            const todoInput = document.getElementById('todoInput');
            const addBtn = document.getElementById('addBtn');
            const stats = document.getElementById('countDisplay');
            const filterBtns = document.querySelectorAll('.filter-btn');
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');

            // ─── State ───
            let todos = [];
            let currentFilter = 'all';
            let isDark = true;

            // ─── Load from localStorage ───
            function loadTodos() {
                const stored = localStorage.getItem('todos');
                if (stored) {
                    try { todos = JSON.parse(stored); } catch (_) { todos = []; }
                } else {
                    // Seed with a couple examples
                    todos = [
                        { id: Date.now() + 1, text: 'Welcome to your new todo list ✨', completed: false },
                        { id: Date.now() + 2, text: 'Try adding a task above', completed: false },
                        { id: Date.now() + 3, text: 'Click the circle to complete', completed: true },
                    ];
                }
                // ensure each has an id
                todos = todos.filter(t => t && typeof t === 'object').map(t => ({
                    id: t.id || Date.now() + Math.random() * 1000,
                    text: t.text || 'Untitled',
                    completed: !!t.completed,
                }));
                saveTodos();
            }

            function saveTodos() {
                localStorage.setItem('todos', JSON.stringify(todos));
            }

            // ─── Theme ───
            function setTheme(dark) {
                isDark = dark;
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
                themeIcon.textContent = dark ? '🌙' : '☀️';
                localStorage.setItem('theme', dark ? 'dark' : 'light');
            }

            function loadTheme() {
                const saved = localStorage.getItem('theme');
                if (saved) {
                    setTheme(saved === 'dark');
                } else {
                    // system preference
                    const prefers = window.matchMedia('(prefers-color-scheme: dark)');
                    setTheme(prefers.matches);
                }
            }

            // ─── Render ───
            function render() {
                const filtered = getFilteredTodos();
                const count = filtered.length;

                if (count === 0) {
                    todoList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">${currentFilter === 'completed' ? '✅' : '📋'}</div>
                            <h3>${currentFilter === 'completed' ? 'No completed tasks' : currentFilter === 'active' ? 'All caught up!' : 'Nothing here yet'}</h3>
                            <p>${currentFilter === 'completed' ? 'Complete a task to see it here.' : currentFilter === 'active' ? 'Add a new task to get started.' : 'Add your first task above.'}</p>
                        </div>
                    `;
                } else {
                    let html = '';
                    filtered.forEach(todo => {
                        const checked = todo.completed ? 'completed' : '';
                        html += `
                            <li class="todo-item ${checked}" data-id="${todo.id}">
                                <button class="todo-check" data-action="toggle" aria-label="Toggle task">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                                </button>
                                <span class="todo-text">${escapeHtml(todo.text)}</span>
                                <button class="todo-delete" data-action="delete" aria-label="Delete task">✕</button>
                            </li>
                        `;
                    });
                    todoList.innerHTML = html;
                }

                // Update stats
                const total = todos.length;
                const active = todos.filter(t => !t.completed).length;
                stats.textContent = total;

                // Update filter button states
                filterBtns.forEach(btn => {
                    const filter = btn.dataset.filter;
                    btn.classList.toggle('active', filter === currentFilter);
                });

                // Update input placeholder
                todoInput.placeholder = todos.length > 0 ? 'Write a new task…' : 'Start your first task…';
            }

            function getFilteredTodos() {
                if (currentFilter === 'all') return todos;
                if (currentFilter === 'active') return todos.filter(t => !t.completed);
                if (currentFilter === 'completed') return todos.filter(t => t.completed);
                return todos;
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ─── CRUD ───
            function addTodo() {
                const text = todoInput.value.trim();
                if (!text) {
                    todoInput.focus();
                    todoInput.style.borderColor = 'var(--delete)';
                    setTimeout(() => todoInput.style.borderColor = '', 600);
                    return;
                }
                const newTodo = {
                    id: Date.now() + Math.random() * 1000,
                    text: text,
                    completed: false,
                };
                todos.push(newTodo);
                saveTodos();
                render();
                todoInput.value = '';
                todoInput.focus();
                // Scroll to bottom
                todoList.scrollTop = todoList.scrollHeight;
            }

            function toggleTodo(id) {
                const todo = todos.find(t => t.id === id);
                if (todo) {
                    todo.completed = !todo.completed;
                    saveTodos();
                    render();
                }
            }

            function deleteTodo(id) {
                const item = todoList.querySelector(`li[data-id="${id}"]`);
                if (item) {
                    item.classList.add('removing');
                    setTimeout(() => {
                        todos = todos.filter(t => t.id !== id);
                        saveTodos();
                        render();
                    }, 280);
                } else {
                    todos = todos.filter(t => t.id !== id);
                    saveTodos();
                    render();
                }
            }

            // ─── Event delegation ───
            todoList.addEventListener('click', (e) => {
                const target = e.target.closest('button');
                if (!target) return;
                const li = target.closest('li');
                if (!li) return;
                const id = Number(li.dataset.id);
                if (isNaN(id)) return;

                const action = target.dataset.action;
                if (action === 'toggle') {
                    toggleTodo(id);
                } else if (action === 'delete') {
                    deleteTodo(id);
                }
            });

            // ─── Input: Enter key ───
            todoInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addTodo();
                }
            });

            addBtn.addEventListener('click', addTodo);

            // ─── Filters ───
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const filter = btn.dataset.filter;
                    if (filter === currentFilter) return;
                    currentFilter = filter;
                    render();
                });
            });

            // ─── Theme toggle ───
            themeToggle.addEventListener('click', () => {
                setTheme(!isDark);
            });

            // ─── Init ───
            loadTheme();
            loadTodos();
            render();

            // ─── Auto-focus ───
            if (window.innerWidth >= 640) {
                todoInput.focus();
            }

            // ─── Keyboard shortcut: Ctrl+K / Cmd+K ───
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault();
                    todoInput.focus();
                    todoInput.select();
                }
            });

        })();
    </script>

</body>
</html>
