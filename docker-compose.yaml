version: '3.8'

services:
  # The Gateway (The only one exposed to Windows)
  nginx-proxy:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ./app:/var/www
    networks:
      - backend-network

  # The PHP Processor
  php-app:
    image: php:8.3-fpm
    container_name: php-app
    volumes:
      - ./app:/var/www
    networks:
      - backend-network

  # The Node.js API
  nestjs-app:
    image: node:20
    container_name: nestjs-app
    working_dir: /app
    volumes:
      - ./app/nestjs-devops:/app
    command: "node server.js" # Assuming you have a nest app there
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge