upstream dockers {
    # For ip hashing
    # ip_hash;
    # for least connection
    # least_conn;

    # By default it follows the round robit algorithm
    # no need to separetely define the round robin algorithm

    server 127.0.0.1:3000 weight=3 max_fails=3 fail_timeout=20s;
    server 127.0.0.1:3001 weight=2;
    server 127.0.0.1:3002 weight=1;
}
server {
    listen 80;
    server_name localhost;    

    root /var/www;
    
    location / {
        index index.php index.html;    
    }

    location /load {
        proxy_pass http://dockers;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}